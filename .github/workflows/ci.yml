name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift 6.2.0
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.0"

      - name: Verify Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test (with coverage)
        run: swift test --enable-code-coverage

      - name: Enforce VitalBarCore line coverage >= 80%
        run: ./Scripts/check-core-coverage.sh 80

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            coverage-summary.json
            coverage-summary.txt
